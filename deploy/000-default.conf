# Configuração do Apache para a VM do Google Cloud.
# Substitui /etc/apache2/sites-available/000-default.conf
#
#   sudo cp /var/www/html/deploy/000-default.conf /etc/apache2/sites-available/000-default.conf
#   sudo a2enmod rewrite
#   sudo systemctl restart apache2

<VirtualHost *:80>
    ServerAdmin webmaster@localhost

    # Só a pasta public/ fica exposta na internet.
    # src/, config/ e database/ ficam fora do alcance do navegador.
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # Permite que o public/.htaccess faça as URLs amigáveis (mod_rewrite)
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
